name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-modules.js

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lint-rules.js

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck --severity=warning cli/banditshell install.sh scripts/*.sh installer/*.sh

  distro:
    name: distro (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: docker.io/library/debian:stable-slim
            install: apt-get update && apt-get install -y --no-install-recommends nodejs bash git python3 lua5.4 luajit jq coreutils findutils grep sed gawk diffutils file procps util-linux
          - name: fedora
            image: registry.fedoraproject.org/fedora:latest
            install: dnf install -y nodejs bash git python3 lua luajit jq coreutils findutils grep sed gawk diffutils file procps-ng util-linux shadow-utils
          - name: opensuse
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            install: zypper -n --gpg-auto-import-keys refresh && zypper -n install --no-recommends nodejs bash git python3 lua54 luajit jq coreutils findutils grep sed gawk diffutils file procps util-linux shadow
          - name: alpine
            image: docker.io/library/alpine:latest
            install: apk add nodejs bash git python3 lua5.4 luajit jq coreutils findutils grep sed gawk diffutils file procps-ng util-linux tzdata shadow runuser
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm --init -v "$PWD:/src:ro" "${{ matrix.image }}" sh -c
          '${{ matrix.install }} && useradd -m tester && cp -a /src /work && chown -R tester /work
          && runuser -u tester -- sh -c "cd /work && node --test tests/*.test.js"'
