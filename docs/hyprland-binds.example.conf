# banditshell: example Hyprland binds.
#
# This file is an EXAMPLE. Copy it into ~/.config/hypr and source it from your
# hyprland.conf, or copy the lines you want straight in:
#
#   source = ~/.config/hypr/banditshell-binds.conf
#
# Every bind here is nothing but an exec of the `banditshell` CLI, the same
# commands you can type in a terminal, so all of it can be rebound, dropped, or
# pointed at other verbs freely; the shell neither knows nor cares which keys
# drive it. `banditshell help` lists every verb there is.

$mod = SUPER

# The big surfaces. Toggles, deliberately: the key that summoned a panel is
# its summoner, and pressing it again puts the panel away, the same contract
# as tapping the corner it came out of.
bind = $mod, SPACE, exec, banditshell launcher toggle
bind = $mod, ESCAPE, exec, banditshell session toggle
bind = $mod, I, exec, banditshell settings toggle
bind = $mod, N, exec, banditshell notifications toggle
bind = $mod, C, exec, banditshell calendar
bind = $mod, M, exec, banditshell notch toggle

# The sidebar menus, by key. `menu toggle` rather than `menu open` for the
# same reason the surfaces above toggle; `banditshell menu list` prints every
# key that can stand here, including any added after this file was written.
bind = $mod, A, exec, banditshell menu toggle audio
bind = $mod, W, exec, banditshell menu toggle network
bind = $mod, B, exec, banditshell menu toggle bluetooth
bind = $mod SHIFT, B, exec, banditshell menu toggle battery

# The hotkey sheet: every bind this compositor knows about, read live from
# `hyprctl binds -j` each time it opens. It is not a list kept in this repo and
# it never can be, so it is right about YOUR binds including the ones you added
# five minutes ago.
#
# SUPER AND QUESTION MARK, because `?` is what every application on earth means
# by "help", and this is the one bind in this file with a trap in it: THERE IS
# NO QUESTION-MARK KEY. `?` is a shifted character, and which physical key it is
# shifted from is a property of the keyboard LAYOUT, not of Hyprland:
#
#   US, UK          ?  is SHIFT + slash    ->  bind = $mod SHIFT, slash, ...
#   Danish, Swedish ?  is SHIFT + plus     ->  bind = $mod SHIFT, plus, ...
#   German          ?  is SHIFT + ssharp   ->  bind = $mod SHIFT, ssharp, ...
#   French (AZERTY) ?  is SHIFT + comma    ->  bind = $mod SHIFT, comma, ...
#
# So the line below is right on a US layout and quietly wrong on the others, and
# quietly is the problem: Hyprland does not complain about a key name it cannot
# resolve, it just never fires the bind, which looks exactly like the shell
# being broken. Find out which key yours is before copying this (`wev` prints
# the keysym for whatever you press), and if you would rather not think about
# layouts at all, drop the SHIFT and bind `$mod, slash`: slash is a physical key
# with a name of its own on every layout, and it needs no modifier to name it.
bind = $mod SHIFT, slash, exec, banditshell hotkeys toggle

# The screenshot picker. Three of its four verbs; `freezeclip` is the fourth
# if you want freeze-and-copy on a single key.
bind = $mod, P, exec, banditshell picker open
bind = $mod SHIFT, P, exec, banditshell picker freeze
bind = $mod CTRL, P, exec, banditshell picker clip

# The lock screen. One direction only, matching the CLI: unlocking happens on
# the lock screen itself, or with `loginctl unlock-session` from a TTY.
bind = $mod, L, exec, banditshell lock

# The wallpaper the shell draws itself. Two of its verbs, and they are the two
# that need a key rather than a terminal: `wallpaper toggle` and `wallpaper
# next` both have to read the current value before writing it, which is exactly
# what `banditshell set wallpaper.enabled` cannot be asked to do from a bind.
#
# ON SHIFT, because plain $mod+W is spoken for above: W is the wifi menu's key
# and a wireless network is the more common thing to want. On a setup where it
# is not, $mod+W is the obvious home for this and the mnemonic is better.
bind = $mod SHIFT, W, exec, banditshell wallpaper toggle
bind = $mod CTRL, W, exec, banditshell wallpaper next

# THE PICKER, which does not need a key and gets one anyway.
#
# Its real way in is the bottom edge: swipe up for the launcher, swipe up again
# and the wallpapers take its place. That gesture is the interface, and this is
# here for the same reason every other surface in this file has a bind, which is
# that a gesture cannot be reached from a script, from a terminal, or from a
# machine you are on over SSH.
bind = $mod ALT, W, exec, banditshell wallpapers toggle

# Volume, on the keys the keyboard already grew for it. `bindel` repeats while
# held and keeps working on the lock screen, which is where volume keys are
# most expected to work; mute gets `bindl` without repeat, because a held
# toggle is a flicker.
bindel = , XF86AudioRaiseVolume, exec, banditshell volume up
bindel = , XF86AudioLowerVolume, exec, banditshell volume down
bindl = , XF86AudioMute, exec, banditshell volume mute

# Media keys. The shell's Media service can play, pause and skip, but nothing
# exposes that over IPC yet, so these stay with playerctl for now; swap the
# exec for a banditshell verb when one exists.
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPrev, exec, playerctl previous
