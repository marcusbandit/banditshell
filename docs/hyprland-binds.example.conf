# banditshell: example Hyprland binds in the legacy .conf syntax.
#
# LEGACY. Hyprland 0.56 and later read Lua, and for that
# docs/hyprland-binds.example.lua is the example to copy: its binds are action
# ids a module resolves when the key is pressed. This file is for Hyprlands
# still on the .conf parser, which has no module to load.
#
# What keeps these binds working across updates is the command they run,
# `banditshell action <id>`. The id is looked up in api/actions.tsv by the
# banditshell you have installed, at the moment the key is pressed, so a later
# regrouping of the command line does not touch them. `banditshell api list`
# prints every id. The long comments below still name the command lines the
# ids stand for, which is what `banditshell api show <id>` prints too.
#
# Copy this file into ~/.config/hypr and source it from your hyprland.conf, or
# copy the lines you want straight in:
#
#   source = ~/.config/hypr/banditshell-binds.conf
#
# `banditshell` has to be on the PATH Hyprland starts with; install.sh links
# ~/.local/bin/banditshell when nothing else provides it, and `banditshell
# doctor api` says whether it resolves to this checkout. Volume, the media keys
# and the lock are not the shell's: they call wpctl, playerctl and loginctl.

$mod = SUPER

# The big surfaces. Toggles, deliberately: the key that summoned a panel is
# its summoner, and pressing it again puts the panel away, the same contract
# as tapping the corner it came out of.
bind = $mod, SPACE, exec, banditshell action launcher.toggle
bind = $mod, V, exec, banditshell action panel.clipboard.toggle
bind = $mod, ESCAPE, exec, banditshell action panel.session.toggle
bind = $mod, I, exec, banditshell action panel.settings.toggle
bind = $mod, N, exec, banditshell action panel.notifications.toggle
bind = $mod, C, exec, banditshell action panel.calendar.toggle
bind = $mod, M, exec, banditshell action panel.media.toggle
bind = $mod SHIFT, M, exec, banditshell action panel.island.toggle
bind = $mod, K, exec, banditshell action panel.calculator.toggle

# The sidebar itself, per monitor. Toggles the column on the monitor the
# keyboard is on; a screen name aims another one (`screen sidebar toggle DP-2`), and
# `all` flips the default every screen follows. Hidden means fully: the band
# alone remains and the windows take the width back.
bind = $mod, Z, exec, banditshell action screen.sidebar.toggle

# BARE: the whole chrome off on every screen, wallpaper only, shell reachable
# by keybind. The chrome and the compositor's numbers are TWO halves on one
# key, and the split is about OWNERSHIP: the flag in config.json is the pair's
# ONE authority - the compositor's numbers never vote, they FOLLOW it. The Lua
# bind reads the flag (io.open: a file read, not a process spawn on the
# compositor's loop) and drives the shell's idempotent on/off verbs beside its
# own hl.config, so a drifted pair converges on the next press instead of
# flipping over together. A number already in place is left alone:
#
#   local function border_bare()
#       local cfg = (os.getenv("XDG_CONFIG_HOME")
#           or os.getenv("HOME") .. "/.config") .. "/banditshell/config.json"
#       local f = io.open(cfg, "r")
#       if not f then return nil end
#       local text = f:read("*a")
#       f:close()
#       if text:match('"bare"%s*:%s*true') then return true end
#       if text:match('"bare"%s*:%s*false') then return false end
#       return nil
#   end
#   hl.bind("SUPER + SHIFT + K", function()
#       local bare = border_bare()
#       if bare == nil then return end
#       if bare then
#           hl.exec_cmd("banditshell screen border on")
#           hl.exec_cmd("hyprctl reload")
#       else
#           hl.exec_cmd("banditshell screen border off")
#           local worn = (hl.get_config("general:gaps_out") or 0) ~= 0
#                     or (hl.get_config("decoration:rounding") or 0) ~= 0
#           if worn then
#               hl.config({ general = { gaps_out = 0, gaps_in = 0 }, decoration = { rounding = 0 } })
#           end
#       end
#   end)
#
# On the legacy parser the same flip is an eval of hl.config, or keyword if
# your Hyprland predates the dialect:
#
# bind = $mod SHIFT, K, exec, banditshell screen border toggle && hyprctl eval "hl.config({ general = { gaps_out = 0, gaps_in = 0 }, decoration = { rounding = 0 } })"
bind = $mod SHIFT, K, exec, banditshell action screen.border.toggle

# The file browser. A window rather than a panel, so this one takes a PATH: the
# useful thing to bind is not "open the browser" but "open the browser here",
# and a bind that carries a directory is the difference between a file manager
# and a file manager you reach for. Bare, it opens wherever it was left.
bind = $mod, E, exec, banditshell action panel.files.toggle

# THE CALCULATOR IS ALSO AN APPLICATION, and deliberately so. The key above is
# the fast way in, and assets/applications/banditshell-calculator.desktop is the
# slow one: copy it into ~/.local/share/applications and the panel turns up in
# the launcher's own list, in any other application menu on the machine, and as
# whatever your desktop's "calculator" key is already bound to.
#
#   install -Dm644 assets/applications/banditshell-calculator.desktop \
#     ~/.local/share/applications/banditshell-calculator.desktop
#
# THE TWO ROUTES ARE NOT THE SAME VERB, which is the one thing worth knowing
# here. The key runs `panel calculator toggle` and gives you the strip on the sidebar's
# flank: a menu body wide, for the sum you do while something else has your
# attention. The desktop entry runs `panel calculator full` and gives you the same
# calculator standing over the whole screen with the keypad grown to suit it,
# because somebody who picked "Calculator" out of an application menu by name
# asked for an application. There is a control on the panel's own readout that
# moves it between the two, so neither route is a dead end, and it is ONE
# calculator either way: whatever is on the line stays on it across the change.
#
# The shape is sticky, so `panel calculator toggle` reopens whichever you last
# used. Bind `panel calculator full` as well if you would rather have the big one
# on a key:
#
#   bind = $mod SHIFT, K, exec, banditshell panel calculator full
#
# except that $mod+SHIFT+K is the on-screen keyboard on this machine, so pick
# another. `banditshell panel calculator` says which shape it is in.
#
# THE HARDWARE KEY, for keyboards that grew one. Harmless on the ones that did
# not: Hyprland simply never fires a bind whose key the layout has no name for.
bindl = , XF86Calculator, exec, banditshell action panel.calculator.toggle

# You do not need it to do arithmetic in passing: the launcher answers anything
# typed into it that carries an operator, so $mod+SPACE, "2+3*4", Enter puts 14
# on the clipboard without the panel ever opening. The panel is for the sums you
# work through a step at a time; the search field is for the ones you already
# know how to write. `banditshell panel calculator answer "2+3*4"` is the third route,
# for a script, and involves no surface at all.

# $mod+V IS THE ONE BIND ABOVE THAT LIKELY REPLACES SOMETHING.
#
# It is the key every clipboard manager takes, because it is paste with the
# modifier changed, so whatever was on it before (a clipse or cliphist window,
# a rofi script) has to come off for this to be reached. That is the intended
# swap and not a collision: this panel exists to be the thing that key opens.
#
# The shell records its own history, so nothing else needs to be running for
# this to work, and a manager left running alongside is harmless: two watchers
# on one clipboard both see every selection and neither can disturb the other's
# store. `banditshell panel clipboard` says whether this one is recording,
# which is the question a history that has quietly stopped growing cannot
# otherwise answer. An existing clipse history is imported once, automatically,
# so the key does not open onto an empty list on the first day.

# The sidebar menus, by key. `toggle` rather than `open` for the same reason
# the surfaces above toggle; `banditshell panel` prints every name that can
# stand here, including any added after this file was written.
bind = $mod, A, exec, banditshell action panel.audio.toggle
bind = $mod, W, exec, banditshell action panel.network.toggle
bind = $mod, B, exec, banditshell action panel.bluetooth.toggle
bind = $mod SHIFT, B, exec, banditshell action panel.battery.toggle

# TIME. The panel is an ordinary menu with the key "clock", so the first line is
# `panel clock toggle`, exactly as $mod+C is for the calendar. The two under it
# are verbs with no panel to be pressed on, and a countdown is the clearest case
# in this file of a thing worth starting without stopping what you were doing:
# it needs no window, no cursor and no menu open, and the shell says so on
# screen by itself when it goes off.
#
# THE TEN MINUTES IS AN EXAMPLE, not a setting. `clock timer start` takes 10m, 90s,
# 2h, 1h30m or a bare number of minutes, so put whichever duration you actually
# reach for in that line, or bind two of them. Adding places and writing alarms
# stay in the terminal, where there is something to type a city or a command
# into; `banditshell clock alarm add 07:00 --days mon-fri --run <command>` is one line
# in a script and does not want a key.
bind = $mod, T, exec, banditshell action panel.clock.toggle
bind = $mod CTRL, T, exec, banditshell action clock.timer.start 10m
bind = $mod SHIFT, T, exec, banditshell action clock.timer.toggle

# NINE MORE MINUTES, and deliberately no key for Stop.
#
# The asymmetry is the point rather than an omission. services/Clock.qml gives
# Snooze the big target in the panel because Apple's own heat-map testing found
# equal-sized Stop and Snooze produced up to thirty percent more oversleeping,
# and the argument only gets stronger on a keyboard: a key you can hit half
# asleep should be able to postpone an alarm and nothing else. Stopping one is
# `banditshell clock alarm stop`, or the panel, which is pinned open in front of you
# anyway the moment something rings.
bind = $mod ALT, T, exec, banditshell action clock.alarm.snooze

# The hotkey sheet: every bind the shell's config scrape knows about, re-read
# on every config reload. It is not a list kept in this repo and it never can
# be, so it is right about YOUR binds including the ones you added five
# minutes ago.
#
# SUPER AND QUESTION MARK, because `?` is what every application on earth means
# by "help", and this is the one bind in this file with a trap in it: THERE IS
# NO QUESTION-MARK KEY. `?` is a shifted character, and which physical key it is
# shifted from is a property of the keyboard LAYOUT, not of Hyprland:
#
#   US, UK          ?  is SHIFT + slash    ->  bind = $mod SHIFT, slash, ...
#   Danish, Swedish ?  is SHIFT + plus     ->  bind = $mod SHIFT, plus, ...
#   German          ?  is SHIFT + ssharp   ->  bind = $mod SHIFT, ssharp, ...
#   French (AZERTY) ?  is SHIFT + comma    ->  bind = $mod SHIFT, comma, ...
#
# So the line below is right on a US layout and quietly wrong on the others, and
# quietly is the problem: Hyprland does not complain about a key name it cannot
# resolve, it just never fires the bind, which looks exactly like the shell
# being broken. Find out which key yours is before copying this (`wev` prints
# the keysym for whatever you press), and if you would rather not think about
# layouts at all, drop the SHIFT and bind `$mod, slash`: slash is a physical key
# with a name of its own on every layout, and it needs no modifier to name it.
bind = $mod SHIFT, slash, exec, banditshell action panel.hotkeys.toggle

# The screenshot picker. Three of its four forms; `screenshot copy --freeze` is
# the fourth if you want freeze-and-copy on a single key.
bind = $mod, P, exec, banditshell action screenshot.save
bind = $mod SHIFT, P, exec, banditshell action screenshot.save_frozen
bind = $mod CTRL, P, exec, banditshell action screenshot.copy

# The lock screen. logind locks the session and the shell's lock screen answers
# it. One direction only: unlocking happens on the lock screen itself, or with
# `loginctl unlock-session` from a TTY.
bind = $mod, L, exec, loginctl lock-session

# The wallpaper the shell draws itself. Two of its verbs, and they are the two
# that need a key rather than a terminal: `wallpaper toggle` and `wallpaper
# next` both have to read the current value before writing it, which is exactly
# what `banditshell config set wallpaper.enabled` cannot be asked to do from a bind.
#
# ON SHIFT, because plain $mod+W is spoken for above: W is the wifi menu's key
# and a wireless network is the more common thing to want. On a setup where it
# is not, $mod+W is the obvious home for this and the mnemonic is better.
#
# `next` STEPS THE MONITOR YOU ARE LOOKING AT, because a wallpaper is per screen
# and a keybind arrives with no screen and means "here": services/Shell.qml
# argues this at length for every verb that reaches the shell without one. On a
# laptop on its own the two readings are the same key.
bind = $mod SHIFT, W, exec, banditshell action wallpaper.toggle
bind = $mod CTRL, W, exec, banditshell action wallpaper.next

# THE WHOLE DESK AT ONCE, which is the other half of a per-screen wallpaper and
# is worth its own key rather than a terminal: `all` sets the DEFAULT and clears
# every screen that had drifted off it, so this is also how you put a desk that
# has been picked at monitor by monitor back into one picture.
#
# Commented rather than bound, because a fourth modifier on W is a stretch and
# because on a single screen it is `wallpaper next` spelled longer. Uncomment it
# the day a second monitor arrives.
# bind = $mod SHIFT CTRL, W, exec, banditshell wallpaper next all

# THE PICKER, which does not need a key and gets one anyway.
#
# Its real way in is the bottom edge: swipe up for the launcher, swipe up again
# and the wallpapers take its place. That gesture is the interface, and this is
# here for the same reason every other surface in this file has a bind, which is
# that a gesture cannot be reached from a script, from a terminal, or from a
# machine you are on over SSH.
bind = $mod ALT, W, exec, banditshell action panel.wallpaper.toggle

# Volume, on the keys the keyboard already grew for it, through wpctl: the
# shell shows the change but does not own the level. `bindel` repeats while
# held and keeps working on the lock screen, which is where volume keys are
# most expected to work; mute gets `bindl` without repeat, because a held
# toggle is a flicker.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# WHERE the sound comes out, which the volume keys cannot say. One key for the
# pair: it goes to whichever of the two you are not on, and to the speakers
# when you are on neither. Which sink each name means is a setting, so this
# bind does nothing at all until `banditshell output assign <role> <name>` has been
# run once on this machine (or the sound page has been visited); `banditshell
# output list` prints the names to assign.
bind = $mod, O, exec, banditshell action output.toggle

# Media keys. These are playerctl's, on purpose: the shell's media panel follows
# the same players, so a key pressed here shows up there, and banditshell has no
# second way of doing what playerctl already does.
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPrev, exec, playerctl previous
