<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0f1114">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://banditshell.marcusrosado.com/">
<meta property="og:image" content="https://banditshell.marcusrosado.com/hero-still.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
{{css}}
</style>
</head>
<body>
<header>
<picture>
<source media="(prefers-reduced-motion: reduce)" srcset="wordmark-still.svg">
<img class="wordmark" src="wordmark.svg" width="900" height="300" alt="banditshell">
</picture>
<h1>{{title}}</h1>
<p class="meta">Updated <time>{{updated}}</time> from <a href="{{source}}">docs/roadmap.md</a></p>
{{intro}}
<nav aria-label="Sections">
{{nav}}
</nav>
</header>
<main>
{{sections}}
</main>
<footer>
<p>banditshell is a desktop shell for Hyprland, written in Quickshell and QML. The code is <a href="{{repo}}">on GitHub</a>.</p>
<p>Built at {{commit}}.</p>
</footer>
</body>
</html>
